<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tropic Fruit Pop - Original</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:linear-gradient(135deg,#1e3a8a,#3b82f6);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px}
.header{width:100%;max-width:420px;text-align:center}
h1{font-size:24px;margin:10px 0}
.badge{background:#22d3ee;color:#000;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;margin-left:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:10px 0}
.stat{background:rgba(255,255,255,0.15);padding:8px;border-radius:10px;text-align:center}
.stat b{display:block;font-size:18px}
#board{width:100%;max-width:400px;aspect-ratio:1;background:rgba(0,0,0,0.3);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:4px}
.cell{background:#fefce8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.cell.selected{outline:3px solid #facc15}
.controls{margin-top:12px;display:flex;gap:10px}
button{padding:10px 18px;border:none;border-radius:20px;font-weight:bold}
.new{background:#38bdf8;color:#000}
.hint{background:rgba(255,255,255,0.2);color:#fff}
</style>
</head>
<body>
<div class="header">
<h1>🍉 Tropic Fruit Pop <span class="badge">ORIGINAL</span></h1>
<div class="stats">
<div class="stat">LEVEL<b id="level">1</b></div>
<div class="stat">SCORE<b id="score">0</b></div>
<div class="stat">MOVES<b id="moves">25</b></div>
<div class="stat">TARGET<b id="target">1200</b></div>
</div>
</div>
<div id="board"></div>
<div class="controls">
<button class="new" onclick="initGame()">New Game</button>
<button class="hint" onclick="showHint()">Hint</button>
<button class="hint" onclick="alert('Tropic Fruit Pop is 100% original.')">Privacy</button>
</div>
<p style="margin-top:12px;font-size:13px">Match 3 or more fruits! 4-match = bonus!</p>
<script>
const FRUITS=['🍓','🍉','🍊','🍇'];const SIZE=8;let board=[],selected=null,score=0,level=1,moves=25,target=1200;
function randFruit(){return FRUITS[Math.floor(Math.random()*FRUITS.length)]}
function createBoard(){board=[];for(let r=0;r<SIZE;r++){let row=[];for(let c=0;c<SIZE;c++){let f;do{f=randFruit();}while((c>=2&&row[c-1]===f&&row[c-2]===f)||(r>=2&&board[r-1][c]===f&&board[r-2][c]===f));row.push(f);}board.push(row);}}
function render(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<SIZE;r++){for(let c=0;c<SIZE;c++){const d=document.createElement('div');d.className='cell';d.textContent=board[r][c];d.onclick=()=>onCell(r,c);if(selected&&selected.r===r&&selected.c===c)d.classList.add('selected');b.appendChild(d);}}document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('moves').textContent=moves;document.getElementById('target').textContent=target;}
function onCell(r,c){if(!selected){selected={r,c};render();return;}const dr=Math.abs(selected.r-r),dc=Math.abs(selected.c-c);if((dr===1&&dc===0)||(dr===0&&dc===1)){swap(selected.r,selected.c,r,c);if(!findMatches().length){swap(r,c,selected.r,selected.c);}else{moves--;doCascade();}selected=null;}else{selected={r,c};}render();}
function swap(r1,c1,r2,c2){let t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;}
function findMatches(){let m=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE-2;c++)if(board[r][c]&&board[r][c]===board[r][c+1]&&board[r][c]===board[r][c+2]){let k=c;while(k<SIZE&&board[r][k]===board[r][c])k++;for(let i=c;i<k;i++)m.push([r,i]);c=k;}for(let c=0;c<SIZE;c++)for(let r=0;r<SIZE-2;r++)if(board[r][c]&&board[r][c]===board[r+1][c]&&board[r][c]===board[r+2][c]){let k=r;while(k<SIZE&&board[k][c]===board[r][c])k++;for(let i=r;i<k;i++)m.push([i,c]);r=k;}return m;}
async function doCascade(){let matches=findMatches();while(matches.length){score+=matches.length*100;matches.forEach(([r,c])=>board[r][c]=null);render();await new Promise(r=>setTimeout(r,250));for(let c=0;c<SIZE;c++){let col=[];for(let r=SIZE-1;r>=0;r--)if(board[r][c])col.push(board[r][c]);for(let r=SIZE-1,i=0;r>=0;r--,i++)board[r][c]=i<col.length?col[i]:randFruit();}matches=findMatches();render();await new Promise(r=>setTimeout(r,200));}if(score>=target){level++;target+=800;moves+=10;alert('Level up! '+level);}if(moves<=0&&score<target){alert('Game over! '+score);initGame();}}
function showHint(){let mm=findMatches();if(mm.length){selected={r:mm[0][0],c:mm[0][1]};render();setTimeout(()=>{selected=null;render();},800);}else alert('Shuffling!');}
function initGame(){score=0;level=1;moves=25;target=1200;selected=null;createBoard();render();}
initGame();
</script>
</body>
</html>
