<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tropic Fruit Pop</title><style>body{background:#1e3a8a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center}h1{margin:16px}#board{width:360px;height:360px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:rgba(0,0,0,.3);padding:8px;border-radius:16px}.cell{background:#fefce8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}.cell.sel{outline:3px solid yellow}</style></head><body><h1>🍉 Tropic Fruit Pop ORIGINAL</h1><div id="info">Score: <b id="s">0</b> | Moves: <b id="m">25</b></div><div id="board"></div><button onclick="init()" style="margin:12px;padding:10px 20px;border-radius:20px">New Game</button><script>const F=['🍓','🍉','🍊','🍇'];let B=[],sel=null,sc=0,mv=25;function r(){return F[Math.floor(Math.random()*4)]}function mk(){B=[];for(let y=0;y<8;y++){let row=[];for(let x=0;x<8;x++){let f;do{f=r()}while((x>=2&&row[x-1]==f&&row[x-2]==f)||(y>=2&&B[y-1][x]==f&&B[y-2][x]==f));row.push(f)}B.push(row)}}function draw(){let d=document.getElementById('board');d.innerHTML='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){let c=document.createElement('div');c.className='cell'+(sel&&sel.y==y&&sel.x==x?' sel':'');c.textContent=B[y][x];c.onclick=()=>click(y,x);d.appendChild(c)}document.getElementById('s').textContent=sc;document.getElementById('m').textContent=mv}function click(y,x){if(!sel){sel={y,x};draw();return}let dy=Math.abs(sel.y-y),dx=Math.abs(sel.x-x);if((dy==1&&dx==0)||(dy==0&&dx==1)){let t=B[sel.y][sel.x];B[sel.y][sel.x]=B[y][x];B[y][x]=t;mv--;check()}sel=null;draw()}function check(){for(let c=0;c<8;c++){for(let y=7;y>=0;y--)if(!B[y]||!B[y][c]){for(let k=y;k>0;k--)B[k][c]=B[k-1][c];B[0][c]=r()}}}function init(){sc=0;mv=25;sel=null;mk();draw()}init()</script></body></html>
